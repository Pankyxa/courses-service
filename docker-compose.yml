version: "3.9"

services:
  backend:
    build: .
    container_name: courses-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - courses-network

networks:
  courses-network:
    driver: bridge